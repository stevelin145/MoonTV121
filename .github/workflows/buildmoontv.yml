name: Build & Upload Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 修复：去掉错误的20.2.2
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # 压缩产物
      - name: Zip output file
        run: zip -r Moontv-${{ github.ref_name }}.zip ./dist
      # 上传到Releases
      - uses: softprops/action-gh-release@v2
        with:
          files: Moontv-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
