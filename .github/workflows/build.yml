name: Build CI
on:
  push:
    branches: [main, master] # 触发分支按需修改
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1.拉取项目代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2.安装Node环境（可自定义node版本）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 改成你项目的node版本，如18、16

      # 3.npm全局安装pnpm【方案3核心步骤】
      - name: Install pnpm via npm global
        run: npm install -g pnpm

      # 4.安装项目依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5.打包构建（根据你的package.json脚本修改）
      - name: Build project
        run: pnpm build

      # 可选：测试命令，不需要删掉
      # - name: Run test
      #   run: pnpm test
